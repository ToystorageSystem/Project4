# =========================
# APPLICATION
# =========================

spring.application.name=toystorage-backend

spring.profiles.active=dev


# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================

# Shared team database:
# chi validate schema, KHONG tu sua cau truc DB
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================
# TIMEZONE
# =========================

# JSON/API su dung gio Viet Nam
spring.jackson.time-zone=Asia/Ho_Chi_Minh


# =========================
# DEV SEED SAFETY
# =========================

# Tuyet doi khong tu seed/reset DB dung chung
app.dev-seed.enabled=false

app.dev-seed.reset=false


# =========================
# SESSION
# =========================

server.servlet.session.timeout=15m

server.servlet.session.cookie.same-site=lax

server.servlet.session.cookie.secure=false


# =========================
# SWAGGER
# =========================

springdoc.swagger-ui.path=/swagger


# =========================
# SERVER
# =========================

server.port=8080


# =========================
# LOGGING
# =========================

logging.level.org.springframework.security=DEBUG


# =========================
# AI / OPENAI
# =========================

# Cho phep bat/tat AI tu bien moi truong.
# Mac dinh false de backend van khoi dong an toan
# khi chua cau hinh AI.
app.ai.enabled=${AI_ENABLED:false}

# OpenAI API base URL.
app.ai.base-url=https://api.openai.com

# KHONG hard-code API key vao file nay.
# API key se duoc lay tu bien moi truong OPENAI_API_KEY.
app.ai.api-key=${OPENAI_API_KEY:}

# Model cung duoc lay tu bien moi truong.
# Tam thoi de rong neu chua cau hinh.
app.ai.model=${OPENAI_MODEL:}
