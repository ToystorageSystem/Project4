
# =========================
# APPLICATION
# =========================

spring.application.name=toystorage-backend
spring.profiles.active=dev

# Load private local configuration.
# File location: project root (same level as pom.xml).
spring.config.import=optional:file:./database-local.properties


# =========================
# DATABASE
# =========================

# Default database connection.
# database-local.properties can override these values.
spring.datasource.url=jdbc:mysql://100.124.247.52:3306/warehouse?serverTimezone=Asia/Ho_Chi_Minh

spring.datasource.username=toystore

# Password must come from DB_PASSWORD or
# database-local.properties.
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================

# Validate the existing schema only.
# Never automatically modify the shared database.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================
# TIMEZONE
# =========================

spring.jackson.time-zone=Asia/Ho_Chi_Minh


# =========================
# DEV SEED SAFETY
# =========================

app.dev-seed.enabled=false
app.dev-seed.reset=false


# =========================
# SESSION
# =========================

# Session expires after 60 minutes of inactivity.
server.servlet.session.timeout=60m

# Protect the session cookie from JavaScript.
server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax

# Local HTTP development only.
# Set to true when using HTTPS in production.
server.servlet.session.cookie.secure=false


# =========================
# SWAGGER
# =========================

springdoc.swagger-ui.path=/swagger


# =========================
# SERVER
# =========================

server.port=8080


# =========================
# LOGGING
# =========================

logging.level.org.springframework.security=DEBUG


# =========================
# AI / OPENAI
# =========================

# Paid AI is disabled by default.
app.ai.enabled=${AI_ENABLED:false}

app.ai.base-url=https://api.openai.com

app.ai.api-key=${OPENAI_API_KEY:}

app.ai.model=${OPENAI_MODEL:}
